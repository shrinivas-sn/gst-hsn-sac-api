<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="gstEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gstCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gstGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Base Badge Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />

  <!-- Goods (HSN) Barcode Grid on Left -->
  <rect x="12" y="18" width="3" height="28" rx="1.5" fill="#64748b" />
  <rect x="18" y="18" width="5" height="28" rx="2" fill="url(#gstCyan)" />
  <rect x="26" y="18" width="2" height="28" rx="1" fill="#64748b" />

