<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gstEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gstCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gstGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="gstDropShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7" />
    </filter>
    <filter id="gstGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Developer Code Brackets Overlay -->
  <path d="M 68 152 C 48 152 36 164 36 200 V 256 C 36 266 28 272 16 272 C 28 272 36 278 36 288 V 344 C 36 380 48 392 68 392" 
        stroke="url(#gstEmeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#gstGlow)" />
  <path d="M 444 152 C 464 152 476 164 476 200 V 256 C 476 266 484 272 496 272 C 484 272 476 278 476 288 V 344 C 476 380 464 392 444 392" 
        stroke="url(#gstEmeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#gstGlow)" />

  <!-- Main Fintech Shield Card -->
  <rect x="96" y="96" width="320" height="320" rx="36" fill="#090d16" stroke="#1e293b" stroke-width="4" filter="url(#gstDropShadow)" />

  <!-- Header Accent Ribbon -->
  <path d="M 96 136 C 96 113.909 113.909 96 136 96 H 376 C 398.091 96 416 113.909 416 136 V 156 H 96 V 136 Z" fill="url(#gstEmeraldGrad)" />

  <!-- Left: HSN Goods Barcode Pillars -->
  <rect x="140" y="196" width="16" height="160" rx="8" fill="url(#gstCyanGrad)" />
  <rect x="168" y="196" width="8" height="160" rx="4" fill="#334155" />
  <rect x="188" y="196" width="22" height="160" rx="10" fill="url(#gstEmeraldGrad)" filter="url(#gstGlow)" />
  <rect x="222" y="196" width="10" height="160" rx="5" fill="#475569" />

  <!-- Right: SAC Services Electric Flash (Services Lightning & Flow) -->
  <path d="M 336 172 L 260 284 H 324 L 284 380 L 388 260 H 324 L 360 172 Z" 
        fill="url(#gstGoldGrad)" filter="url(#gstGlow)" stroke="#090d16" stroke-width="3" stroke-linejoin="round" />

  <!-- Dynamic Accent Node Circles -->
  <circle cx="372" cy="128" r="8" fill="#ffffff" />
  <circle cx="344" cy="128" r="5" fill="#ffffff" opacity="0.6" />
</svg>
