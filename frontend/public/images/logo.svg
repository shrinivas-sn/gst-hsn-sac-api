<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gstEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gstCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gstGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="gstShadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020617" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Developer API Brackets on Sides -->
  <path d="M 48 140 C 28 140 16 152 16 188 V 244 C 16 254 8 260 -4 260 C 8 260 16 266 16 276 V 332 C 16 368 28 380 48 380" 
        stroke="url(#gstEmeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 464 140 C 484 140 496 152 496 188 V 244 C 496 254 504 260 516 260 C 504 260 496 266 496 276 V 332 C 496 368 484 380 464 380" 
        stroke="url(#gstEmeraldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 3D Isometric Goods & Services Fintech Box (Fills Canvas) -->
  <g filter="url(#gstShadow)">
    <!-- Top Isometric Lid (Emerald & Mint) -->
    <path d="M 256 40 L 460 148 L 256 256 L 52 148 Z" fill="url(#gstEmeraldGrad)" stroke="#047857" stroke-width="4" stroke-linejoin="round" />
    <path d="M 154 94 L 358 202 M 256 40 L 256 256" stroke="#a7f3d0" stroke-width="3" opacity="0.6" />

    <!-- Left Facet: HSN Goods Barcode (Cyan & Deep Slate) -->
    <path d="M 52 148 L 256 256 V 472 L 52 364 Z" fill="#090d16" stroke="#1e293b" stroke-width="4" stroke-linejoin="round" />
    <rect x="90" y="220" width="24" height="160" rx="10" fill="url(#gstCyanGrad)" transform="skewY(27.5)" />
    <rect x="136" y="196" width="36" height="160" rx="14" fill="#ffffff" transform="skewY(27.5)" />
    <rect x="194" y="166" width="22" height="160" rx="10" fill="url(#gstEmeraldGrad)" transform="skewY(27.5)" />

    <!-- Right Facet: SAC Services Electric Surge (Gold & Dark Slate) -->
    <path d="M 256 256 L 460 148 V 364 L 256 472 Z" fill="#1e293b" stroke="#334155" stroke-width="4" stroke-linejoin="round" />
    <path d="M 384 180 L 304 300 H 368 L 296 424 L 424 272 H 356 L 396 180 Z" 
          fill="url(#gstGoldGrad)" stroke="#b45309" stroke-width="3" stroke-linejoin="round" />
  </g>
</svg>
