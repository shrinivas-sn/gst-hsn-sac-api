<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gstEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gstCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gstGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="gstGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Developer Code Brackets Overlay -->
  <path d="M 68 152 C 48 152 36 164 36 200 V 256 C 36 266 28 272 16 272 C 28 272 36 278 36 288 V 344 C 36 380 48 392 68 392" 
        stroke="url(#gstEmeraldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#gstGlow)" />
  <path d="M 444 152 C 464 152 476 164 476 200 V 256 C 476 266 484 272 496 272 C 484 272 476 278 476 288 V 344 C 476 380 464 392 444 392" 
        stroke="url(#gstEmeraldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" filter="url(#gstGlow)" />

  <!-- Left: HSN Goods Barcode Pillars -->
  <rect x="110" y="140" width="24" height="232" rx="12" fill="url(#gstCyanGrad)" filter="url(#gstGlow)" />
  <rect x="150" y="170" width="14" height="172" rx="7" fill="#64748b" />
  <rect x="180" y="140" width="34" height="232" rx="17" fill="url(#gstEmeraldGrad)" filter="url(#gstGlow)" />
  <rect x="230" y="160" width="16" height="192" rx="8" fill="#38bdf8" />

  <!-- Right: SAC Services Electric Flash (Services Lightning & Flow) -->
  <path d="M 370 100 L 260 260 H 350 L 290 412 L 440 230 H 350 L 400 100 Z" 
        fill="url(#gstGoldGrad)" filter="url(#gstGlow)" stroke="#b45309" stroke-width="3" stroke-linejoin="round" />

  <!-- Dynamic Accent Node Circles -->
  <circle cx="430" cy="110" r="10" fill="#34d399" />
  <circle cx="400" cy="80" r="6" fill="#60a5fa" />
</svg>
